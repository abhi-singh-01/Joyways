name: Deploy Production

# Manual production deploy only (workflow_dispatch). Runs in the GitHub "production"
# environment so OIDC federated credentials match:
#   repo:abhi-singh-01/joyway:environment:production
#
# Authentication: GitHub OIDC → azure/login@v2 → Azure RBAC (AcrPush) → az acr login
# Do NOT use AZURE_CLIENT_SECRET, ACR_USERNAME, or ACR_PASSWORD.
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables,
# or on the "production" environment):
#   AZURE_CLIENT_ID
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   ACR_LOGIN_SERVER          e.g. joywayprodacr.azurecr.io
#   NEXT_PUBLIC_API_BASE_URL  e.g. https://joyway-backend-prod....azurecontainerapps.io
#   RAZORPAY_KEY_ID_PUBLIC    public checkout key only (rzp_live_* / rzp_test_*)
#
# Do NOT store DATABASE_*, JWT_*, RAZORPAY_KEY_SECRET, SMTP_*, STORAGE_* or other
# runtime private secrets in GitHub Actions. Inject them in Azure at runtime only.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag (e.g. sha or v1.0.0)
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and push images to ACR
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Azure variables are configured
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_LOGIN_SERVER NEXT_PUBLIC_API_BASE_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Missing GitHub variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,"
            echo "ACR_LOGIN_SERVER, and NEXT_PUBLIC_API_BASE_URL as GitHub Actions variables."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name joywayprodacr

      - name: Build and push backend
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/joyway-backend:${{ inputs.image_tag }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Build and push frontend
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/joyway-frontend:${{ inputs.image_tag }}"
          docker build -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="${{ vars.RAZORPAY_KEY_ID_PUBLIC }}" \
            ./frontend
          docker push "$IMAGE"

      - name: Deploy note
        run: |
          echo "Images pushed to ACR. Update Azure compute to pull:"
          echo "  ${{ vars.ACR_LOGIN_SERVER }}/joyway-backend:${{ inputs.image_tag }}"
          echo "  ${{ vars.ACR_LOGIN_SERVER }}/joyway-frontend:${{ inputs.image_tag }}"
          echo "Wire runtime env vars (DATABASE_*, JWT_*, RAZORPAY_*, STORAGE_*) in Azure — not in GitHub."
