name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.joyway.in
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      NEXT_PUBLIC_SUPPORT_EMAIL: support@joyway.in
      NEXT_PUBLIC_BOOKINGS_EMAIL: bookings@joyway.in
      NEXT_PUBLIC_GENERAL_EMAIL: hello@joyway.in
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t joyway-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build -t joyway-frontend:ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.joyway.in \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_test_ci_placeholder \
            ./frontend

  secret-scan:
    name: Secret pattern scan (source only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if real env/credential files are tracked
        run: |
          set -euo pipefail
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.(local|production|development|test|staging|vault))|(^|/).envrc$|\.pem$|\.p12$|\.jks$|(^|/)(credentials|secrets|service-account.*)\.json$' || true)
          leaked=$(printf '%s\n' "$leaked" | grep -vE '\.env\.(example|template|production\.example)$' || true)
          if [ -n "$leaked" ]; then
            echo "Secret files must not be committed to GitHub:"
            echo "$leaked"
            exit 1
          fi
          echo "No tracked .env or credential files."

      - name: Scan tracked source for obvious secret literals
        run: |
          set -euo pipefail
          # Fail if real-looking secrets appear in source (not in .env files — those are gitignored).
          patterns='(RAZORPAY_KEY_SECRET|STORAGE_SECRET_KEY|JWT_SECRET|SMTP_PASSWORD)\s*=\s*[^$\s][^\s#]+'
          if rg -n "$patterns" backend/src frontend/lib frontend/app frontend/proxy.ts 2>/dev/null; then
            echo "Possible hardcoded secret found in source."
            exit 1
          fi
          echo "No obvious hardcoded secrets in application source."
