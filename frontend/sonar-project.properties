sonar.projectKey=joyway-frontend
sonar.projectName=joyway-frontend
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.mjs
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=node_modules/**,.next/**,out/**,coverage/**,public/**,eslint-report.json,**/*.config.js,**/*.config.ts,**/*.test.ts,**/*.test.tsx,vitest.config.ts
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.tsx,**/*.jsx,proxy.ts,lib/api/**,lib/hooks/**,lib/razorpay.ts,lib/utils.ts,lib/publicCredits.ts,lib/publicEmails.ts,app/**,next-env.d.ts,components/**/use*.ts,**/*.config.js,**/*.config.ts
