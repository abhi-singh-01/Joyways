management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: ""
  endpoint:
    health:
      enabled: false

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    in.joyway: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

joyway:
  jwt:
    cookie-secure: true
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
