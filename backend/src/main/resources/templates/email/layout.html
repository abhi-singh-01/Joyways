<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{brandName}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f5;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <tr>
            <td style="background:#1b4332;padding:28px 32px;">
              <p style="margin:0;font-size:24px;font-weight:700;color:#ffffff;letter-spacing:0.5px;">{{brandName}}</p>
              <p style="margin:6px 0 0;font-size:13px;color:#b7e4c7;">{{tagline}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid #e8ece9;background:#fafbfa;">
              <p style="margin:0;font-size:12px;color:#6b7280;line-height:1.6;">
                Need help? Contact us at <a href="mailto:{{supportEmail}}" style="color:#1b4332;">{{supportEmail}}</a>
              </p>
              <p style="margin:8px 0 0;font-size:11px;color:#9ca3af;">© {{year}} JOYWAY. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
